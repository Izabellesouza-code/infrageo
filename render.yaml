# Blueprint Render — InfraGeo AM (WebGIS)
# Docs: https://render.com/docs/blueprint-spec
#
# Deploy: Dashboard Render → New → Blueprint → selecione este repositório.
# Ou: New → Web Service → Runtime Docker (raiz com Dockerfile).
#
# Memória: Free/Starter = 512 MB (GIS pode OOM). Para estabilidade use Standard (2 GB)
# no Dashboard: Settings → Instance Type → Standard.

services:
  - type: web
    name: webgis-infrageo
    runtime: docker
    plan: free
    region: ohio
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: INFRAGEO_ENV
        value: production
      # UI no Vercel; este serviço só expõe a API GIS
      - key: INFRAGEO_API_ONLY
        value: "1"
      - key: INFRAGEO_FRONTEND_URL
        value: https://infrageo-webgis.vercel.app
      - key: CORS_ORIGINS
        value: https://infrageo-webgis.vercel.app
      - key: WEB_CONCURRENCY
        value: "1"
      - key: GUNICORN_TIMEOUT
        value: "180"
      # false = evita pico de RAM no boot (importante em 512 MB)
      - key: GUNICORN_PRELOAD
        value: "false"
      - key: GUNICORN_KEEPALIVE
        value: "5"
      - key: LOG_LEVEL
        value: info
      - key: INFRAGEO_BG_WARMUP
        value: "1"
      # Libera caches GeoJSON e pula warm-up pesado do limite estadual
      - key: INFRAGEO_LOW_MEMORY
        value: "1"
      - key: INFRAGEO_SKIP_LIMITE_WARMUP
        value: "1"
      # Índice sob demanda (economiza RAM no boot)
      - key: INFRAGEO_SKIP_INDEX
        value: "1"
      # Simplifica geometrias no modo low-memory (~30–40 m)
      - key: INFRAGEO_SIMPLIFY_TOLERANCE
        value: "0.00035"
      # PORT é definido automaticamente pelo Render — não fixe aqui.
